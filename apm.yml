name: claude-breadcrumbs
version: 0.1.0
description: Session search MCP + cross-tool handoff for Claude Code and Codex CLI
author: Akceptor
targets:
  - claude
  - codex
dependencies:
  mcp:
    - name: sessions
      registry: false
      transport: stdio
      command: uvx
      args: ["--from", "git+ssh://git@github.com/Akceptor/claude-breadcrumbs", "breadcrumbs-mcp"]
