[project]
name = "ai-breadcrumbs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "zstandard"]

[project.scripts]
breadcrumbs-mcp = "breadcrumbs_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"server/server.py" = "breadcrumbs_mcp.py"
